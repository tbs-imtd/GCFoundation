name: Publish NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 1.0.0-preview.1)'
        required: true
        default: '1.0.0-preview.1'

jobs:

  publish:
    name: Pack and Publish
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install NPM packages
      working-directory: GCFoundation.Components
      run: npm install

    - name: Restore dependencies
      run: dotnet restore

    # Extract version from tag (removes 'v' prefix if present) or use manual input
    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present (v1.0.0 -> 1.0.0)
          VERSION="${VERSION#v}"
        else
          VERSION="${{ github.event.inputs.version }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Using version: $VERSION"

    - name: Pack GCFoundation.Common
      run: dotnet pack GCFoundation.Common/GCFoundation.Common.csproj --configuration Release --output ./nupkgs -p:Version=${{ steps.version.outputs.VERSION }}

    - name: Pack GCFoundation.Security
      run: dotnet pack GCFoundation.Security/GCFoundation.Security.csproj --configuration Release --output ./nupkgs -p:Version=${{ steps.version.outputs.VERSION }}

    - name: Pack GCFoundation.Components
      run: dotnet pack GCFoundation.Components/GCFoundation.Components.csproj --configuration Release --output ./nupkgs -p:Version=${{ steps.version.outputs.VERSION }}

    # Get a short-lived NuGet API key
    - name: Login to NuGet.org (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }} # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your nuget.org username (profile name), NOT your email address
    
    # Push the package
    - name: Publish to NuGet.org
      run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
